[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wangp"
version = "0.1.0"
description = "Headless CLI pipeline for WanGP. No Gradio, no notebooks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MonkeyCode-AI" }]
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.package-data]
wangp = ["static/*"]

[project.scripts]
wangp = "wangp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
